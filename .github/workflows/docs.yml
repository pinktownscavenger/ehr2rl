name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs for pushes to main,
# receives Pages write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with docs extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"

      - name: Run documentation tests
        run: python -m pytest docs/tests

      - name: Build site
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let an in-progress deployment finish rather than cancelling it.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
