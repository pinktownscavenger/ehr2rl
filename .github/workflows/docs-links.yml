name: Docs links

# External links are checked on a schedule, never on pull requests, so an
# unreachable third-party site cannot block a contribution.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with docs extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"

      - name: Check external links
        run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck
